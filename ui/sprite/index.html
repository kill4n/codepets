<!doctype html>
<html><head><meta charset="utf-8"><title>codepets sprite</title>
<style>
  html,body{margin:0;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;height:100%}
  /* the window reserves room ABOVE the sprite for the speech bubble: sprite sits at the bottom, centred */
  body{display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
  #c{display:block;flex:none;image-rendering:pixelated;cursor:grab}
  /* session name under the sprite: a small pill, same width as the sprite, draggable like it */
  #name{flex:none;margin-top:calc(var(--label-pull,0px) * -1);height:var(--label-h,0px);line-height:var(--label-h,0px);max-width:100%;box-sizing:border-box;padding:0 6px;
        font:10px/var(--label-h,0px) system-ui;color:#fff;background:rgba(20,20,30,.72);border-radius:9px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;cursor:grab;
        transition:opacity 800ms ease}
  #name:empty,#name.hidden{display:none}
  #name.fade{opacity:0}
  /* comic-style speech bubble anchored over the sprite's head */
  #tip{position:absolute;left:50%;bottom:calc(var(--sprite-h,128px) + var(--label-h,0px) - var(--label-pull,0px));transform:translate(-50%,-10px) scale(.6);transform-origin:50% 100%;
       width:max-content;max-width:calc(100% - 12px);box-sizing:border-box;
       background:#fffbe8;color:#1a1a22;border:2px solid #222;border-radius:10px;
       font:11px/1.35 system-ui;padding:5px 8px;white-space:normal;overflow-wrap:anywhere;text-align:center;
       box-shadow:0 2px 0 #222;opacity:0;visibility:hidden;pointer-events:none;
       transition:transform 120ms cubic-bezier(.2,1.4,.4,1),opacity 120ms ease}
  #tip.show{opacity:1;visibility:visible;transform:translate(-50%,-10px) scale(1)}
  /* permission prompt held for the bubble: summary + buttons (the only interactive part of the bubble) */
  #tip .ask{margin-top:4px;padding-top:4px;border-top:1px dashed #b9b29a}
  #tip .ask code{display:block;font:10px/1.3 ui-monospace,Menlo,monospace;max-height:4.2em;overflow:auto;color:#333;
                 white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;pointer-events:auto}
  #tip .actions{display:flex;gap:4px;justify-content:center;margin-top:4px;pointer-events:auto}
  #tip .actions button{font:10px system-ui;padding:2px 6px;border-radius:6px;border:1px solid #222;background:#fff;cursor:pointer}
  #tip .actions button.ok{background:#d9f4dc}
  #tip .actions button.bad{background:#fde0dc}
  /* tail: dark outline triangle + lighter inner triangle, pointing down at the sprite */
  #tip::before,#tip::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border-style:solid;border-color:transparent}
  #tip::before{border-width:9px 7px 0 7px;border-top-color:#222;margin-top:2px}
  #tip::after{border-width:7px 5px 0 5px;border-top-color:#fffbe8;margin-top:0}
</style></head>
<body><canvas id="c"></canvas><div id="name"></div><div id="tip" role="status"></div><script type="module" src="./main.ts"></script></body></html>
