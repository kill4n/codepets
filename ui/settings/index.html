<!doctype html>
<html><head><meta charset="utf-8"><title>CodePets</title>
<style>
  :root{color-scheme:light dark;--bg:#f4f4f6;--card:#fff;--fg:#1c1c22;--muted:#6b6b78;--line:#e2e2e8;--code:#eeeef2;--ok:#1a7f37;--bad:#b42318;--warn:#9a6700}
  @media (prefers-color-scheme:dark){:root{--bg:#17171c;--card:#22222a;--fg:#ececf2;--muted:#9a9aa8;--line:#34343e;--code:#2c2c36;--ok:#4ac26b;--bad:#ff7b72;--warn:#e3b341}}
  body{font:14px system-ui;margin:0;padding:14px;color:var(--fg);background:var(--bg)}
  h1{display:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px}
  h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:2px 0 8px}
  p{margin:6px 0}
  button,select,input[type=number]{font:inherit;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
  button{cursor:pointer} button:hover{border-color:var(--muted)}
  button.danger{color:var(--bad)}
  .ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}
  .banner{border-radius:8px;padding:6px 10px;border:1px solid var(--line);background:var(--card)}
  .footer{text-align:center;font-size:12px}
  ul{list-style:none;padding:0;margin:0} li{margin:0;padding:8px 0;border-top:1px solid var(--line)} li:first-child{border-top:0}
  li.child{margin-left:18px}
  code{font-size:12px;background:var(--code);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
  .tag{font-size:11px;margin-left:6px;padding:0 6px;border-radius:8px;background:var(--code);color:var(--muted)}
  .row-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  label{display:flex;gap:8px;align-items:center;margin:6px 0}
</style></head>
<body><h1>CodePets</h1><div id="app"></div><script type="module" src="./main.ts"></script></body></html>
